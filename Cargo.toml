[package]
name = "ServerPartyRSF"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.33.3"
egui_extras = "0.33.3"
log = "0.4.29"
env_logger = "0.11.10"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
rouille = "3.6.2"
ureq = { version = "3.3.0", features = ["json"] }
urlencoding = "2.1.3"
uuid = { version = "1.24.0", features = ["v4", "v7", "fast-rng"] }